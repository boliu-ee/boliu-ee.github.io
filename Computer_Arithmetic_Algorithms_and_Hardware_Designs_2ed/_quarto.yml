project:
  type: book
  output-dir: _book

book:
  title: "计算机算术：算法与硬件设计（中文解读版）"
  subtitle: "Computer Arithmetic: Algorithms and Hardware Designs (2nd Edition) 研读笔记"
  author: "刘博士研读整理（原著：Behrooz Parhami）"
  date: today
  chapters:
    - index.qmd
    - part: "第一部分 数的表示 (Number Representation)"
      chapters:
        - ch01.qmd
        - ch02.qmd
        - ch03.qmd
        - ch04.qmd
    - part: "第二部分 加法与减法 (Addition/Subtraction)"
      chapters:
        - ch05.qmd
        - ch06.qmd
        - ch07.qmd
        - ch08.qmd
    - part: "第三部分 乘法 (Multiplication)"
      chapters:
        - ch09.qmd
        - ch10.qmd
        - ch11.qmd
        - ch12.qmd
    - part: "第四部分 除法 (Division)"
      chapters:
        - ch13.qmd
        - ch14.qmd
        - ch15.qmd
        - ch16.qmd
    - part: "第五部分 实数运算 (Real Arithmetic)"
      chapters:
        - ch17.qmd
        - ch18.qmd
        - ch19.qmd
        - ch20.qmd
    - part: "第六部分 函数求值 (Function Evaluation)"
      chapters:
        - ch21.qmd
        - ch22.qmd
        - ch23.qmd
        - ch24.qmd
    - part: "第七部分 实现专题 (Implementation Topics)"
      chapters:
        - ch25.qmd
        - ch26.qmd
        - ch27.qmd
        - ch28.qmd
    - appendix.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: false
    code-tools: true
    highlight-style: github
    css: styles.css
    lang: zh
  pdf:
    documentclass: scrreprt
