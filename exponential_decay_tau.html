<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>指数衰减 h(t)=exp(-t/τ) 可视化</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --axis: #111827;
      --grid: #e5e7eb;
      --curve: #2563eb;
      --dash: #ef4444;
      --tau: #7c3aed;
      --soft: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
        "Microsoft YaHei", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #e0ecff 0, transparent 28%),
        radial-gradient(circle at bottom right, #fce7f3 0, transparent 25%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .app {
      width: min(1050px, 100%);
      height: min(680px, calc(100vh - 28px));
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 22px;
      box-shadow: 0 18px 52px rgba(15, 23, 42, 0.12);
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.12;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .formula {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      background: var(--soft);
      color: #3730a3;
      border-radius: 999px;
      padding: 7px 13px;
      font-family: "Times New Roman", serif;
      font-size: 19px;
      white-space: nowrap;
    }

    .main {
      min-height: 0;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid #edf0f7;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
    }

    .control-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .tau-label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 4px;
    }

    .tau-value {
      font-size: 32px;
      font-weight: 780;
      letter-spacing: -0.04em;
      color: var(--tau);
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--tau);
      cursor: pointer;
    }

    .range-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: -10px;
    }

    .readouts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .readout {
      background: #f9fafb;
      border: 1px solid #eef0f4;
      border-radius: 14px;
      padding: 11px 12px;
    }

    .readout .k {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .readout .v {
      font-size: 17px;
      font-weight: 730;
    }

    .chart-panel {
      min-height: 0;
      padding: 8px 10px 10px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 6px;
    }

    .chart-wrap {
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg {
      width: 100%;
      height: 100%;
      max-height: 470px;
      display: block;
      user-select: none;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .tick-text {
      fill: var(--muted);
      font-size: 12px;
    }

    .axis-label {
      fill: var(--axis);
      font-size: 14px;
      font-weight: 700;
    }

    .curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dash-line {
      stroke: var(--dash);
      stroke-width: 2.1;
      stroke-dasharray: 7 6;
    }

    .tau-line {
      stroke: var(--tau);
      stroke-width: 2.1;
      stroke-dasharray: 7 6;
    }

    .point {
      fill: #fff;
      stroke: var(--dash);
      stroke-width: 3;
    }

    .label-pill {
      fill: white;
      stroke: #e5e7eb;
      stroke-width: 1;
      filter: drop-shadow(0 3px 8px rgba(15,23,42,0.12));
    }

    .label-text {
      fill: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .legend-note {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      padding: 0 4px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      white-space: nowrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .swatch {
      width: 20px;
      height: 0;
      border-top: 3px solid var(--curve);
      display: inline-block;
    }

    .swatch.dash {
      border-top-color: var(--dash);
      border-top-style: dashed;
    }

    .swatch.tau {
      border-top-color: var(--tau);
      border-top-style: dashed;
    }

    .note {
      text-align: right;
    }

    @media (max-width: 820px) {
      body {
        overflow: auto;
        height: auto;
        min-height: 100vh;
        padding: 10px;
      }

      .app {
        height: auto;
        min-height: calc(100vh - 20px);
        padding: 14px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .control-panel {
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        align-items: center;
      }

      .readouts {
        grid-column: 1 / -1;
        grid-template-columns: repeat(2, 1fr);
      }

      svg {
        height: 430px;
      }

      .legend-note {
        flex-direction: column;
        align-items: flex-start;
      }

      .note {
        text-align: left;
      }
    }

    @media (max-height: 620px) and (min-width: 821px) {
      .app {
        height: calc(100vh - 20px);
        padding: 12px;
        gap: 10px;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        font-size: 13px;
      }

      .main {
        grid-template-columns: 240px 1fr;
        gap: 10px;
      }

      .control-panel {
        padding: 12px;
        gap: 11px;
      }

      .tau-value {
        font-size: 27px;
      }

      .readout {
        padding: 9px 10px;
      }

      .formula {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="topbar">
      <div class="title-block">
        <h1>指数衰减函数的时间常数 τ</h1>
        <p class="subtitle">
          拖动滑块改变 τ。τ 越大，衰减越慢；当 t = τ 时，h(t) = 1/e ≈ 0.3679。
        </p>
      </div>
      <div class="formula">h(t) = exp(−t / τ)</div>
    </section>

    <section class="main">
      <aside class="panel control-panel">
        <div>
          <div class="tau-label">时间常数 τ</div>
          <div class="tau-value"><span id="tauValue">2.00</span> s</div>
        </div>

        <div>
          <input
            id="tauSlider"
            type="range"
            min="0.2"
            max="8"
            value="2"
            step="0.05"
            aria-label="调节时间常数 tau"
          />
          <p class="subtitle">范围：0.20 s — 8.00 s</p>
        </div>

        <div class="readouts">
          <div class="readout">
            <div class="k">τ 处的函数值</div>
            <div class="v">h(τ) = <span id="hTau">0.3679</span></div>
          </div>
          <div class="readout">
            <div class="k">物理含义</div>
            <div class="v">衰减到 <span id="percent">36.79</span>%</div>
          </div>
        </div>
      </aside>

      <section class="panel chart-panel">
        <div class="chart-wrap">
          <svg id="chart" viewBox="0 0 900 460" role="img" aria-label="指数衰减函数图像">
            <defs>
              <clipPath id="plotClip">
                <rect id="clipRect" x="68" y="32" width="760" height="340" rx="10"></rect>
              </clipPath>
            </defs>

            <rect x="0" y="0" width="900" height="460" fill="transparent"></rect>

            <g id="gridGroup"></g>
            <g id="axisGroup"></g>

            <path id="curvePath" class="curve" clip-path="url(#plotClip)"></path>

            <line id="tauLine" class="tau-line"></line>
            <line id="oneOverELine" class="dash-line"></line>
            <line id="horizontalGuide" class="dash-line"></line>
            <circle id="tauPoint" class="point" r="5.5"></circle>

            <g id="tauLabel">
              <rect class="label-pill" rx="10" ry="10"></rect>
              <text class="label-text"></text>
            </g>

            <g id="oneOverELabel">
              <rect class="label-pill" rx="10" ry="10"></rect>
              <text class="label-text"></text>
            </g>

            <text x="448" y="432" text-anchor="middle" class="axis-label">时间 t / s</text>
            <text x="19" y="202" text-anchor="middle" class="axis-label" transform="rotate(-90 19 202)">h(t)</text>
          </svg>
        </div>

        <div class="legend-note">
          <div class="legend">
            <span><i class="swatch"></i>h(t)</span>
            <span><i class="swatch tau"></i>t = τ</span>
            <span><i class="swatch dash"></i>h(t) = 1/e</span>
          </div>
          <div class="note">横轴固定为 0—10 s，便于比较不同 τ 下的衰减速度。</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const slider = document.getElementById("tauSlider");
    const tauValue = document.getElementById("tauValue");
    const hTau = document.getElementById("hTau");
    const percent = document.getElementById("percent");

    const gridGroup = document.getElementById("gridGroup");
    const axisGroup = document.getElementById("axisGroup");
    const curvePath = document.getElementById("curvePath");
    const tauLine = document.getElementById("tauLine");
    const oneOverELine = document.getElementById("oneOverELine");
    const horizontalGuide = document.getElementById("horizontalGuide");
    const tauPoint = document.getElementById("tauPoint");
    const tauLabel = document.getElementById("tauLabel");
    const oneOverELabel = document.getElementById("oneOverELabel");

    const plot = {
      left: 68,
      top: 32,
      width: 760,
      height: 340
    };

    const xMin = 0;
    const xMax = 10;
    const yMin = 0;
    const yMax = 1.05;
    const oneOverE = 1 / Math.E;

    function xScale(t) {
      return plot.left + ((t - xMin) / (xMax - xMin)) * plot.width;
    }

    function yScale(y) {
      return plot.top + plot.height - ((y - yMin) / (yMax - yMin)) * plot.height;
    }

    function makeSvgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) {
        el.setAttribute(k, v);
      }
      return el;
    }

    function drawAxesAndGrid() {
      gridGroup.innerHTML = "";
      axisGroup.innerHTML = "";

      gridGroup.appendChild(makeSvgEl("rect", {
        x: plot.left,
        y: plot.top,
        width: plot.width,
        height: plot.height,
        rx: 10,
        fill: "#ffffff",
        stroke: "#eef0f4"
      }));

      for (let x = 0; x <= 10; x += 2) {
        const px = xScale(x);

        gridGroup.appendChild(makeSvgEl("line", {
          x1: px,
          y1: plot.top,
          x2: px,
          y2: plot.top + plot.height,
          class: "grid"
        }));

        axisGroup.appendChild(makeSvgEl("line", {
          x1: px,
          y1: plot.top + plot.height,
          x2: px,
          y2: plot.top + plot.height + 6,
          class: "axis"
        }));

        const text = makeSvgEl("text", {
          x: px,
          y: plot.top + plot.height + 24,
          "text-anchor": "middle",
          class: "tick-text"
        });
        text.textContent = x.toFixed(0);
        axisGroup.appendChild(text);
      }

      const yTicks = [0, 0.25, 0.5, 0.75, 1.0];
      for (const y of yTicks) {
        const py = yScale(y);

        gridGroup.appendChild(makeSvgEl("line", {
          x1: plot.left,
          y1: py,
          x2: plot.left + plot.width,
          y2: py,
          class: "grid"
        }));

        axisGroup.appendChild(makeSvgEl("line", {
          x1: plot.left - 6,
          y1: py,
          x2: plot.left,
          y2: py,
          class: "axis"
        }));

        const text = makeSvgEl("text", {
          x: plot.left - 12,
          y: py + 4,
          "text-anchor": "end",
          class: "tick-text"
        });
        text.textContent = y.toFixed(y === 1 ? 0 : 2).replace(/0$/, "").replace(/\.$/, "");
        axisGroup.appendChild(text);
      }

      axisGroup.appendChild(makeSvgEl("line", {
        x1: plot.left,
        y1: plot.top + plot.height,
        x2: plot.left + plot.width,
        y2: plot.top + plot.height,
        class: "axis"
      }));

      axisGroup.appendChild(makeSvgEl("line", {
        x1: plot.left,
        y1: plot.top,
        x2: plot.left,
        y2: plot.top + plot.height,
        class: "axis"
      }));
    }

    function setLabel(group, x, y, text) {
      const rect = group.querySelector("rect");
      const txt = group.querySelector("text");
      txt.textContent = text;
      txt.setAttribute("x", x);
      txt.setAttribute("y", y);

      requestAnimationFrame(() => {
        const box = txt.getBBox();
        const padX = 9;
        const padY = 6;
        rect.setAttribute("x", box.x - padX);
        rect.setAttribute("y", box.y - padY);
        rect.setAttribute("width", box.width + padX * 2);
        rect.setAttribute("height", box.height + padY * 2);
      });
    }

    function updateChart() {
      const tau = parseFloat(slider.value);
      tauValue.textContent = tau.toFixed(2);
      hTau.textContent = oneOverE.toFixed(4);
      percent.textContent = (oneOverE * 100).toFixed(2);

      const samples = 500;
      let d = "";

      for (let i = 0; i <= samples; i++) {
        const t = xMin + (i / samples) * (xMax - xMin);
        const y = Math.exp(-t / tau);
        const px = xScale(t);
        const py = yScale(y);
        d += (i === 0 ? "M" : "L") + px.toFixed(2) + "," + py.toFixed(2) + " ";
      }

      curvePath.setAttribute("d", d);

      const tauX = xScale(tau);
      const eY = yScale(oneOverE);
      const bottomY = plot.top + plot.height;

      tauLine.setAttribute("x1", tauX);
      tauLine.setAttribute("y1", bottomY);
      tauLine.setAttribute("x2", tauX);
      tauLine.setAttribute("y2", eY);

      oneOverELine.setAttribute("x1", plot.left);
      oneOverELine.setAttribute("y1", eY);
      oneOverELine.setAttribute("x2", tauX);
      oneOverELine.setAttribute("y2", eY);

      horizontalGuide.setAttribute("x1", tauX);
      horizontalGuide.setAttribute("y1", eY);
      horizontalGuide.setAttribute("x2", plot.left + plot.width);
      horizontalGuide.setAttribute("y2", eY);
      horizontalGuide.setAttribute("opacity", "0.32");

      tauPoint.setAttribute("cx", tauX);
      tauPoint.setAttribute("cy", eY);

      const tauLabelX = Math.min(Math.max(tauX - 38, plot.left + 16), plot.left + plot.width - 130);
      setLabel(tauLabel, tauLabelX, bottomY - 13, `t = τ = ${tau.toFixed(2)} s`);

      setLabel(oneOverELabel, plot.left + 18, eY - 10, "1/e ≈ 0.3679");
    }

    drawAxesAndGrid();
    updateChart();

    slider.addEventListener("input", updateChart);
    window.addEventListener("resize", updateChart);
  </script>
</body>
</html>
